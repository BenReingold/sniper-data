name: Scan tickers from 8-K press releases

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Scan
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          TIME_BUDGET: "18000"
          MODE: yearly
        run: python3 scripts/scan_tickers.py

      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add earnings_dates/cik_tickers.csv
          git diff --cached --quiet || { git commit -m "Ticker scan from 8-K press releases ($(date -u +%F))"; git pull --rebase -q; git push; }

      - name: Continue in a new run if not finished
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/more_to_do ]; then gh workflow run scan_tickers.yml --ref main; echo "next run dispatched"; fi
