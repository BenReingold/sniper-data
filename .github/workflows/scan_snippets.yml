name: Save press-release snippets (8-K item 2.02, 2004-2011)

on:
  workflow_dispatch:
    inputs:
      budget:
        description: "Seconds before the run stops"
        default: "18000"

permissions:
  contents: write
  actions: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Scan
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          TIME_BUDGET: ${{ inputs.budget || '18000' }}
          OUT: /tmp/part.jsonl.gz
        run: python3 scripts/scan_snippets.py

      - name: Upload part and save progress
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/part.jsonl.gz ]; then
            gh release view snippets >/dev/null 2>&1 || gh release create snippets --title "Press-release snippets" --notes "Earnings-related lines of 8-K item 2.02 exhibit 99, 2004-2011. One gzip JSON-lines file per run."
            name="part_$(date -u +%Y%m%d_%H%M%S).jsonl.gz"
            cp /tmp/part.jsonl.gz "/tmp/$name"
            gh release upload snippets "/tmp/$name"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snippets/done.txt
          git diff --cached --quiet || { git commit -m "Snippet scan progress ($(date -u +%F))"; git pull --rebase -q; git push; }

      - name: Continue in a new run if not finished
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/more_to_do ]; then gh workflow run scan_snippets.yml --ref main; echo "next run dispatched"; fi
